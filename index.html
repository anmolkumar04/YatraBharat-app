    function App() {
      const [stateKeys] = useState(Object.keys(INDIA_STATES_DATA));
      const [activeStateKey, setActiveStateKey] = useState('rajasthan');
      const [activeTab, setActiveTab] = useState('route');
      
      // Filter Search for States
      const [searchTerm, setSearchTerm] = useState('');

      // Geolocation
      const [userLocation, setUserLocation] = useState(null);
      const [isLocating, setIsLocating] = useState(false);

      // Route Navigation
      const [selectedTargetItem, setSelectedTargetItem] = useState(null);
      const [routeData, setRouteData] = useState(null);
      const [isCalculatingRoute, setIsCalculatingRoute] = useState(false);
      const [commuteMode, setCommuteMode] = useState('driving');

      // Budget Engine
      const [tripDays, setTripDays] = useState(4);
      const [travelersCount, setTravelersCount] = useState(2);
      const [comfortTier, setComfortTier] = useState('moderate');

      const currentState = INDIA_STATES_DATA[activeStateKey];

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Filtered State List
      const filteredStates = useMemo(() => {
        return stateKeys.filter(key => {
          const item = INDIA_STATES_DATA[key];
          return item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                 item.capital.toLowerCase().includes(searchTerm.toLowerCase());
        });
      }, [searchTerm, stateKeys]);

      // Browser Geolocation
      const handleGetLiveLocation = () => {
        setIsLocating(true);
        if (!navigator.geolocation) {
          setIsLocating(false);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            let addressName = "My GPS Location";

            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
              const data = await res.json();
              if (data && data.address) {
                addressName = data.address.city || data.address.state || "My Live GPS";
              }
            } catch (e) {}

            const newLoc = { lat, lng, addressName };
            setUserLocation(newLoc);
            setIsLocating(false);

            if (selectedTargetItem) {
              calculateRouteOSRM(newLoc, selectedTargetItem, commuteMode);
            }
          },
          () => {
            setIsLocating(false);
            setUserLocation({ lat: currentState.lat, lng: currentState.lng, addressName: `${currentState.name} Center` });
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // OSRM Road Routing
      const calculateRouteOSRM = async (origin, destination, mode) => {
        setIsCalculatingRoute(true);
        try {
          const profile = mode === 'walking' ? 'foot' : mode === 'bicycling' ? 'bike' : 'car';
          const url = `https://router.project-osrm.org/route/v1/${profile}/${origin.lng},${origin.lat};${destination.lng},${destination.lat}?overview=full&geometries=geojson&steps=true`;
          
          const res = await fetch(url);
          const data = await res.json();

          if (data.code === 'Ok' && data.routes && data.routes[0]) {
            const route = data.routes[0];
            const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
            const legs = route.legs[0];

            setRouteData({
              distanceKm: (route.distance / 1000).toFixed(1),
              durationMins: Math.round(route.duration / 60),
              coordinates,
              steps: legs.steps.map(s => ({
                instruction: s.maneuver.modifier ? `Turn ${s.maneuver.modifier} onto ${s.name || 'road'}` : `Continue route`,
                distance: `${Math.round(s.distance)} m`
              }))
            });
          }
        } catch (e) {
          setRouteData(null);
        } finally {
          setIsCalculatingRoute(false);
        }
      };

      const handleSelectDestinationForRoute = (item) => {
        setSelectedTargetItem(item);
        setActiveTab('route');
        const origin = userLocation || { lat: currentState.lat, lng: currentState.lng };
        calculateRouteOSRM(origin, item, commuteMode);
      };

      const openNativeGoogleMaps = (destItem) => {
        const destLat = destItem ? destItem.lat : currentState.lat;
        const destLng = destItem ? destItem.lng : currentState.lng;
        let url = `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}`;
        if (userLocation) url += `&origin=${userLocation.lat},${userLocation.lng}`;
        window.open(url, '_blank');
      };

      const budgetBreakdown = useMemo(() => {
        const baseMap = { budget: 1800, moderate: 4500, luxury: 12000 };
        const base = baseMap[comfortTier];
        const transport = Math.round(base * 0.25 * tripDays * travelersCount);
        const stay = Math.round(base * 0.40 * tripDays * Math.ceil(travelersCount / 2));
        const food = Math.round(base * 0.20 * tripDays * travelersCount);
        const activities = Math.round(base * 0.15 * tripDays * travelersCount);
        const total = transport + stay + food + activities;
        return { transport, stay, food, activities, total, perPerson: Math.round(total / travelersCount) };
      }, [tripDays, travelersCount, comfortTier]);

      return (
        <div className="min-h-screen pb-20 text-gray-100 flex flex-col items-center">
          
          {/* APP HEADER */}
          <header className="w-full max-w-7xl px-4 pt-6 pb-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-violet-500/20">
                <i data-lucide="compass" className="w-6 h-6 text-white animate-spin-slow"></i>
              </div>
              <div>
                <h1 className="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-violet-300">
                  YatraBharat
                </h1>
                <p className="text-xs text-slate-400 font-medium">SIH Smart Tourism Platform • All 36 States & UTs</p>
              </div>
            </div>

            {/* State Search Bar */}
            <div className="relative w-full md:w-72">
              <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input 
                type="text" 
                placeholder="Search state or capital..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-9 pr-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs focus:outline-none focus:border-violet-500 text-white placeholder-slate-500"
              />
            </div>
          </header>

          {/* ALL STATES HORIZONTAL SLIDER */}
          <section className="w-full max-w-7xl px-4 my-2">
            <div className="flex items-center gap-2 overflow-x-auto pb-3 custom-scrollbar">
              {filteredStates.map((key) => {
                const item = INDIA_STATES_DATA[key];
                const isActive = activeStateKey === key;
                return (
                  <button
                    key={key}
                    onClick={() => {
                      setActiveStateKey(key);
                      setSelectedTargetItem(null);
                      setRouteData(null);
                    }}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold shrink-0 transition flex items-center gap-2 border ${
                      isActive 
                        ? 'bg-violet-600 border-violet-500 text-white shadow-lg shadow-violet-600/30' 
                        : 'glass-card border-white/10 text-slate-300 hover:border-white/20'
                    }`}
                  >
                    <span>{item.name}</span>
                    <span className="text-[10px] opacity-60">({item.type === 'Union Territory' ? 'UT' : 'State'})</span>
                  </button>
                );
              })}
            </div>
          </section>

          {/* STATE HERO BANNER */}
          <section className="w-full max-w-7xl px-4 my-3">
            <div className="relative rounded-3xl overflow-hidden h-56 md:h-64 glass-card border border-white/10 flex items-end p-6">
              <img 
                src={currentState.bgImage} 
                alt={currentState.name} 
                className="absolute inset-0 w-full h-full object-cover opacity-40 mix-blend-overlay scale-105 transition-transform duration-1000"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>

              <div className="relative z-10 w-full flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/20 border border-violet-500/30 text-violet-300 text-xs font-semibold mb-2">
                    <i data-lucide="map-pin" className="w-3.5 h-3.5"></i> Capital: {currentState.capital}
                  </div>
                  <h2 className="text-3xl md:text-5xl font-extrabold text-white tracking-tight">{currentState.name}</h2>
                </div>

                <div className="flex flex-wrap gap-2">
                  <div className="glass-card px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs border border-white/10">
                    <i data-lucide="cloud-sun" className="w-4 h-4 text-amber-400"></i>
                    <div>
                      <div className="text-slate-400 text-[10px]">Weather</div>
                      <div className="font-semibold text-white">{currentState.weather}</div>
                    </div>
                  </div>
                  <div className="glass-card px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs border border-white/10">
                    <i data-lucide="calendar" className="w-4 h-4 text-emerald-400"></i>
                    <div>
                      <div className="text-slate-400 text-[10px]">Best Season</div>
                      <div className="font-semibold text-white">{currentState.bestTime}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* FLOATING NAVIGATION TABS */}
          <nav className="w-full max-w-7xl px-4 sticky top-4 z-40 my-2">
            <div className="p-1.5 rounded-2xl glass-card border border-white/10 shadow-2xl flex items-center justify-around gap-1 overflow-x-auto custom-scrollbar">
              {[
                { id: 'route', label: 'Route & Map', icon: 'map' },
                { id: 'attractions', label: 'Top Places', icon: 'compass' },
                { id: 'culture', label: 'Culture & Food', icon: 'book-open' },
                { id: 'hotels', label: 'Hotels & Stays', icon: 'building' },
                { id: 'budget', label: 'Budget Engine', icon: 'calculator' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`relative flex items-center gap-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition ${
                    activeTab === tab.id ? 'bg-violet-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>

          {/* MAIN TAB CONTENT */}
          <main className="w-full max-w-7xl px-4 my-4 flex-1">
            <AnimatePresence mode="wait">
              <motion.div
                key={`${activeStateKey}-${activeTab}`}
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -12 }}
                transition={{ duration: 0.2 }}
              >
                {/* TAB 1: ROUTE & LEAFLET MAP */}
                {activeTab === 'route' && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 flex flex-col gap-4">
                      <div className="p-4 rounded-2xl glass-card border border-white/10 flex flex-wrap items-center justify-between gap-3">
                        <button
                          onClick={handleGetLiveLocation}
                          disabled={isLocating}
                          className="px-4 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 font-semibold text-xs flex items-center gap-2"
                        >
                          <i data-lucide="crosshair" className={`w-4 h-4 ${isLocating ? 'animate-spin' : ''}`}></i>
                          {isLocating ? 'Locating...' : 'Locate Me (GPS)'}
                        </button>
                        <div className="text-xs">
                          <span className="text-slate-400">Origin: </span>
                          <span className="font-semibold text-white">{userLocation ? userLocation.addressName : `${currentState.name} Center`}</span>
                        </div>
                      </div>

                      <MapComponent 
                        stateItem={currentState} 
                        userLocation={userLocation} 
                        targetItem={selectedTargetItem} 
                        routeCoordinates={routeData ? routeData.coordinates : null}
                      />

                      <button
                        onClick={() => openNativeGoogleMaps(selectedTargetItem)}
                        className="w-full py-3 rounded-2xl bg-gradient-to-r from-violet-600 to-emerald-600 text-white font-semibold text-xs flex items-center justify-center gap-2 shadow-lg"
                      >
                        <i data-lucide="external-link" className="w-4 h-4"></i> Open Turn-By-Turn Navigation in Google Maps App
                      </button>
                    </div>

                    <div className="p-5 rounded-2xl glass-card border border-white/10 flex flex-col">
                      <h3 className="text-base font-bold text-white flex items-center gap-2 mb-3">
                        <i data-lucide="milestone" className="w-4 h-4 text-emerald-400"></i> Route Guide
                      </h3>
                      {selectedTargetItem ? (
                        <div>
                          <div className="p-3 rounded-xl bg-violet-500/10 border border-violet-500/20 mb-3">
                            <div className="text-xs text-violet-300 font-medium">Destination</div>
                            <div className="text-base font-bold text-white">{selectedTargetItem.name}</div>
                            {routeData && (
                              <div className="mt-2 text-xs text-emerald-400 font-bold">{routeData.distanceKm} km • ~{routeData.durationMins} mins</div>
                            )}
                          </div>
                          <div className="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1">
                            {routeData && routeData.steps.map((step, idx) => (
                              <div key={idx} className="p-2.5 rounded-xl bg-white/5 border border-white/5 text-xs flex gap-2">
                                <span className="text-violet-400 font-mono">{idx + 1}.</span>
                                <div>
                                  <div className="text-slate-200">{step.instruction}</div>
                                  <div className="text-slate-500 text-[10px]">{step.distance}</div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div className="text-center py-12 text-slate-500 text-xs">Select any attraction or hotel to view step-by-step route directions.</div>
                      )}
                    </div>
                  </div>
                )}

                {/* TAB 2: ATTRACTIONS */}
                {activeTab === 'attractions' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    {currentState.attractions.map(item => (
                      <div key={item.id} className="rounded-2xl glass-card border border-white/10 overflow-hidden flex flex-col group">
                        <div className="relative h-44 overflow-hidden">
                          <img src={item.img} alt={item.name} className="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
                          <div className="absolute top-3 left-3 px-2 py-0.5 rounded-full bg-slate-900/80 text-violet-300 text-[10px] font-bold">{item.category}</div>
                        </div>
                        <div className="p-4 flex flex-col justify-between flex-1">
                          <div>
                            <h3 className="text-base font-bold text-white">{item.name}</h3>
                            <div className="text-xs text-slate-400 mt-1">{item.cost} • {item.time}</div>
                          </div>
                          <button 
                            onClick={() => handleSelectDestinationForRoute(item)}
                            className="mt-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold text-xs transition"
                          >
                            Route on Map
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* TAB 3: CULTURE & HERITAGE */}
                {activeTab === 'culture' && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="p-5 rounded-2xl glass-card border border-white/10">
                      <h3 className="text-base font-bold text-white mb-4">Local Phrases</h3>
                      {currentState.phrases.map((p, i) => (
                        <div key={i} className="p-3 rounded-xl bg-white/5 mb-2">
                          <div className="text-violet-300 font-bold text-sm">{p.local}</div>
                          <div className="text-xs text-slate-300">{p.text}</div>
                        </div>
                      ))}
                    </div>
                    <div className="p-5 rounded-2xl glass-card border border-white/10">
                      <h3 className="text-base font-bold text-white mb-4">Regional Delicacies</h3>
                      {currentState.foods.map((food, i) => (
                        <div key={i} className="flex gap-3 p-2 rounded-xl bg-white/5 mb-2">
                          <img src={food.img} alt={food.name} className="w-14 h-14 rounded-lg object-cover shrink-0" />
                          <div>
                            <div className="text-sm font-bold text-white">{food.name}</div>
                            <div className="text-xs text-slate-400">{food.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="p-5 rounded-2xl glass-card border border-white/10">
                      <h3 className="text-base font-bold text-white mb-4">Travel Etiquette</h3>
                      <div className="text-xs space-y-2">
                        <div className="text-emerald-400 font-bold">DO'S:</div>
                        {currentState.dosAndDonts.dos.map((d, i) => <div key={i} className="text-slate-300">• {d}</div>)}
                        <div className="text-rose-400 font-bold pt-2">DON'TS:</div>
                        {currentState.dosAndDonts.donts.map((d, i) => <div key={i} className="text-slate-300">• {d}</div>)}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 4: HOTELS */}
                {activeTab === 'hotels' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {currentState.hotels.map(h => (
                      <div key={h.id} className="rounded-2xl glass-card border border-white/10 overflow-hidden">
                        <img src={h.img} alt={h.name} className="w-full h-44 object-cover" />
                        <div className="p-4">
                          <h3 className="text-base font-bold text-white">{h.name}</h3>
                          <div className="text-xs text-slate-400 mt-1">{h.dist}</div>
                          <div className="mt-4 flex justify-between items-center">
                            <span className="text-emerald-400 font-extrabold text-sm">{h.price}</span>
                            <button onClick={() => handleSelectDestinationForRoute(h)} className="px-3 py-1.5 rounded-xl bg-violet-600 text-xs font-semibold">Navigate</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* TAB 5: BUDGET ENGINE */}
                {activeTab === 'budget' && (
                  <div className="p-6 rounded-2xl glass-card border border-white/10 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">Trip Estimator</h3>
                      <div>
                        <div className="text-xs text-slate-300 mb-1">Days: {tripDays}</div>
                        <input type="range" min="1" max="14" value={tripDays} onChange={e => setTripDays(Number(e.target.value))} className="w-full accent-violet-500" />
                      </div>
                      <div>
                        <div className="text-xs text-slate-300 mb-1">Travelers: {travelersCount}</div>
                        <input type="range" min="1" max="8" value={travelersCount} onChange={e => setTravelersCount(Number(e.target.value))} className="w-full accent-emerald-500" />
                      </div>
                    </div>
                    <div className="flex flex-col justify-between p-4 bg-white/5 rounded-xl border border-white/5">
                      <div className="text-xs text-slate-400">Total Estimated Trip Cost</div>
                      <div className="text-4xl font-black text-emerald-400">₹{budgetBreakdown.total.toLocaleString()}</div>
                      <div className="text-xs text-slate-300 mt-2">Per Person Share: <strong>₹{budgetBreakdown.perPerson.toLocaleString()}</strong></div>
                    </div>
                  </div>
                )}
              </motion.div>
            </AnimatePresence>
          </main>
        </div>
      );
    }

    // Leaflet Canvas Subcomponent
    function MapComponent({ stateItem, userLocation, targetItem, routeCoordinates }) {
      const containerRef = useRef(null);
      const instanceRef = useRef(null);
      const layerRef = useRef(null);
      const lineRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        if (!instanceRef.current) {
          const map = L.map(containerRef.current, { zoomControl: false }).setView([stateItem.lat, stateItem.lng], 9);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
          layerRef.current = L.layerGroup().addTo(map);
          instanceRef.current = map;
        }

        const map = instanceRef.current;
        const group = layerRef.current;
        group.clearLayers();
        if (lineRef.current) map.removeLayer(lineRef.current);

        const bounds = [];

        if (userLocation) {
          const uIcon = L.divIcon({ html: `<div class="w-4 h-4 rounded-full bg-cyan-400 border-2 border-white shadow-lg animate-pulse"></div>` });
          L.marker([userLocation.lat, userLocation.lng], { icon: uIcon }).addTo(group);
          bounds.push([userLocation.lat, userLocation.lng]);
        }

        stateItem.attractions.forEach(item => {
          const icon = L.divIcon({
            html: `<div class="w-6 h-6 rounded-full bg-violet-600 border border-white text-white flex items-center justify-center font-bold text-xs">📍</div>`
          });
          L.marker([item.lat, item.lng], { icon }).addTo(group);
          bounds.push([item.lat, item.lng]);
        });

        if (routeCoordinates && routeCoordinates.length > 0) {
          lineRef.current = L.polyline(routeCoordinates, { color: '#10b981', weight: 4, dashArray: '6,6' }).addTo(map);
          map.fitBounds(lineRef.current.getBounds(), { padding: [40, 40] });
        } else if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [30, 30] });
        } else {
          map.setView([stateItem.lat, stateItem.lng], 9);
        }
      }, [stateItem, userLocation, targetItem, routeCoordinates]);

      return (
        <div className="w-full h-[380px] rounded-2xl overflow-hidden border border-white/10 glass-card relative">
          <div ref={containerRef} className="w-full h-full"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
